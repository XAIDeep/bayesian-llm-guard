[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bayesian-llm-guard"
version = "0.1.0"
description = "Epistemic Uncertainty Estimation & Guardrails for Agentic LLMs and RAG Systems"
readme = "README.md"
authors = ["AI Research Team <research@xaideep.com>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
numpy = "^1.24.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
black = "^23.3.0"
isort = "^5.12.0"