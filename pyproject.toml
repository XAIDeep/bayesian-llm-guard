[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bayesian-llm-guard"
version = "1.2.2"
description = "Epistemic Uncertainty Estimation & Guardrails for Agentic LLMs and RAG Systems"
readme = "README.md"
authors = ["AI Research Team <research@xaideep.com>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
torch = ">=2.0.0"
filelock = [
    { version = "==3.20.3", python = "<3.11" },
    { version = ">=4.2.1,<5.0", python = ">=3.11" },
]
numpy = [
    { version = ">=1.24.0,<2.0.0", python = "<3.13" },
    { version = ">=2.0.0,<3.0.0", python = ">=3.13" },
]
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.10.1"
isort = "^5.12.0"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "main"
build_command = "pip install poetry && poetry build"
commit_message = "chore(release): v{version} [skip ci]"
commit_author = "github-actions[bot] <actions@github.com>"